# A imagem é construída apenas pelo serviço `app`; outros serviços reutilizam a tag.
x-php: &php
  image: rabbitmq-library-php:8.5
  pull_policy: never
  volumes:
    - .:/app
  env_file: .env
  depends_on:
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Container PHP que fica vivo sem executar nada. Uso:
  #   docker compose exec app php setup.php
  #   docker compose exec app sh
  # Quando um lab precisar de processo de longa duração (consumer, relay),
  # adicione outro serviço com `<<: *php` e `command: ["php", "consumer.php"]`.
  app-rabbit:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app-rabbit
    command: ["sleep", "infinity"]

volumes:
  rabbitmq-data:
